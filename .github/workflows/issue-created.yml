name: Issue Created — Auto Label & Project

on:
  issues:
    types: [opened]

permissions:
  issues: write
  contents: read

jobs:
  label:
    name: Auto-label
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply keyword-based labels
        uses: actions/github-script@v7
        with:
          script: |
            const title = context.payload.issue.title.toLowerCase();
            const body  = (context.payload.issue.body || '').toLowerCase();
            const text  = `${title} ${body}`;

            const keywordMap = {
              'frontend': ['ui', 'css', 'style', 'frontend', 'front-end', 'visual', 'animation', 'responsive', 'mobile'],
              'backend':  ['backend', 'back-end', 'api', 'rest', 'php', 'server', 'hook', 'filter'],
              'block-editor': ['block', 'gutenberg', 'editor', 'blockeditor'],
              'accessibility': ['a11y', 'accessibility', 'aria', 'keyboard', 'screen-reader'],
              'performance': ['slow', 'performance', 'perf', 'lag', 'memory', 'optimize'],
              'security': ['xss', 'csrf', 'injection', 'escape', 'sanitize', 'nonce'],
              'compatibility': ['theme', 'compatibility', 'conflict', 'plugin conflict'],
            };

            const labelsToAdd = [];
            for (const [label, keywords] of Object.entries(keywordMap)) {
              if (keywords.some(k => text.includes(k))) {
                labelsToAdd.push(label);
              }
            }

            if (labelsToAdd.length > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.issue.number,
                labels: labelsToAdd,
              });
              console.log(`Applied labels: ${labelsToAdd.join(', ')}`);
            } else {
              console.log('No keyword-based labels matched.');
            }

  project:
    name: Add to GitHub Project
    runs-on: ubuntu-latest
    # Requires a GitHub Project (v2) to exist.
    # Set PROJECT_URL in repository secrets or variables:
    #   https://github.com/orgs/<owner>/projects/<number>
    #
    # If you don't have a project yet, create one at:
    #   https://github.com/orgs/{owner}/projects/new
    # Then set the PROJECT_URL secret.
    if: ${{ vars.PROJECT_URL != '' || secrets.PROJECT_URL != '' }}
    steps:
      - uses: actions/add-to-project@v1.0.2
        with:
          project-url: ${{ vars.PROJECT_URL || secrets.PROJECT_URL }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
