name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.0'
          tools: composer

      - name: Install PHP dependencies
        run: composer install --no-dev --optimize-autoloader

      - name: Install JS dependencies
        run: npm ci

      - name: Build zip
        run: npm run zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        with:
          files: beplus-visual-mega-nav.zip
          generate_release_notes: true

      - name: Unzip build for SVN deploy
        run: unzip -q beplus-visual-mega-nav.zip -d build-deploy

      - name: Deploy to WordPress.org
        uses: 10up/action-wordpress-plugin-deploy@stable
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: beplus-visual-mega-nav
          BUILD_DIR: build-deploy/beplus-visual-mega-nav

      - name: Notify deploy
        if: success()
        run: |
          curl -sS -X POST https://post-message-cms.beplus-agency.cloud/api/v1/messages \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.NOTIFY_TOKEN }}" \
            -d "{
              \"text\": \"✅ *Beplus Visual Mega Navigation ${{ github.ref_name }}* released!\\n📦 GitHub: ${{ github.repository }}\\n🔗 Release: https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}\\n🔗 WordPress.org: https://wordpress.org/plugins/beplus-visual-mega-nav\",
              \"branch\": \"alert-beplus-services-noti\"
            }"
